<!DOCTYPE html>
<html lang="pt-mz">
<head>
  <meta charset="UTF-8">
  <title>{% block titulo %}SGE-Mandlakazi{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-success mb-4">
    <div class="container">
      <span class="navbar-brand">SGE-Mandlakazi</span>
      {% if user.is_authenticated %}
        <span class="text-white me-3">Ola, {{ user.nome }}</span>
        <a class="btn btn-outline-light btn-sm" href="{% url 'contas:sair' %}">Sair</a>
      {% endif %}
    </div>
  </nav>
  <div class="container">
    {% for mensagem in messages %}
      <div class="alert alert-{{ mensagem.tags }}">{{ mensagem }}</div>
    {% endfor %}
    {% block conteudo %}{% endblock %}
  </div>
</body>
</html>
