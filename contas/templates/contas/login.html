{% extends 'base.html' %}
{% block titulo %}Entrar — SGE-Mandlakazi{% endblock %}
{% block conteudo %}
<div class="row justify-content-center">
  <div class="col-md-4 mt-5">
    <div class="card shadow-sm">
      <div class="card-body">
        <h4 class="mb-3">Entrar no sistema</h4>
        <!-- {% csrf_token %} é OBRIGATORIO em todo formulario POST: é um
           'selo' secreto que prova que o pedido veio mesmo deste site,
           e nao de um site malicioso a tentar enviar pedidos em teu nome #} -->
        <form method="post">
          {% csrf_token %}
          {{ form.as_p }}
          <button type="submit" class="btn btn-success w-100">Entrar</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
